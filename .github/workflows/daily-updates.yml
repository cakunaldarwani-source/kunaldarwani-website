name: Daily news & notifications (11:00 AM IST)

# 05:30 UTC = 11:00 AM IST, every day
on:
  schedule:
    - cron: "30 5 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write
  pull-requests: write

concurrency:
  group: site-content
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r requirements.txt anthropic
      - name: Fetch from official sources (CBDT, RBI, SEBI, GST, ICAI, MCA, CBIC)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          AI_PROVIDER: ${{ vars.AI_PROVIDER }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CLAUDE_MODEL: ${{ vars.CLAUDE_MODEL }}
        run: python scripts/fetch_updates.py
      - name: Commit new items
        id: commit
        run: |
          if git diff --quiet -- data/updates.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"; echo "No new items."
          else
            git config user.name "updates-bot"
            git config user.email "updates-bot@users.noreply.github.com"
            git add data/updates.json
            git commit -m "Daily updates $(TZ=Asia/Kolkata date +%Y-%m-%d)"
            git pull --rebase && git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

  deploy:
    needs: fetch
    if: needs.fetch.outputs.changed == 'true'
    uses: ./.github/workflows/deploy.yml

  summaries:
    needs: fetch
    if: needs.fetch.outputs.changed == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { ref: main }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r requirements.txt anthropic
      - name: Draft summaries
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          AI_PROVIDER: ${{ vars.AI_PROVIDER }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CLAUDE_MODEL: ${{ vars.CLAUDE_MODEL }}
        run: python scripts/summarize_updates.py
      - name: ICAI wording check on summaries
        id: sumcheck
        continue-on-error: true
        run: |
          set -o pipefail
          python scripts/icai_check.py data/summaries.json | tee -a automation/summaries_review.md
      - name: Publish directly (default)
        if: vars.REQUIRE_SUMMARY_REVIEW != 'true'
        run: |
          git diff --quiet -- data/summaries.json && exit 0
          if [ "${{ steps.sumcheck.outcome }}" != "success" ]; then echo "ICAI check failed - not publishing"; git checkout -- data/summaries.json; exit 0; fi
          git config user.name "updates-bot"; git config user.email "updates-bot@users.noreply.github.com"
          git add data/summaries.json && git commit -m "Summaries $(TZ=Asia/Kolkata date +%Y-%m-%d)" && git pull --rebase && git push
      - name: Open pull request for review (only if REQUIRE_SUMMARY_REVIEW is true)
        if: vars.REQUIRE_SUMMARY_REVIEW == 'true'
        uses: peter-evans/create-pull-request@v6
        with:
          branch: summaries/daily
          commit-message: "Summaries for review"
          title: "Review today's notification summaries"
          labels: summaries
          body-path: automation/summaries_review.md
          add-paths: data/summaries.json

  publish-summaries:
    needs: summaries
    if: vars.REQUIRE_SUMMARY_REVIEW != 'true'
    uses: ./.github/workflows/deploy.yml
